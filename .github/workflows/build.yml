name: build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: cp lib/main.dart /tmp/main.dart.bak
      - run: cp pubspec.yaml /tmp/pubspec.yaml.bak
      - run: flutter create --platforms=android --org com.lucky.hkcalendar --project-name hk_calendar .
      - run: cp /tmp/main.dart.bak lib/main.dart
      - run: cp /tmp/pubspec.yaml.bak pubspec.yaml
      - run: flutter pub get
      - run: |
          python3 << 'PY'
          import pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          t = p.read_text()
          perms = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
              '<uses-permission android:name="android.permission.USE_EXACT_ALARM" />',
              '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
              '<uses-permission android:name="android.permission.WAKE_LOCK" />',
              '<uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />',
          ]
          for perm in perms:
              if perm not in t:
                  t = t.replace('<application', perm + '\n    <application', 1)
          p.write_text(t)
          print(p.read_text())
          PY
      - run: |
          python3 << 'PY'
          import pathlib, re
          p = pathlib.Path('android/app/build.gradle.kts')
          t = p.read_text()
          t = t.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          t = t.replace('compileSdk = 35', 'compileSdk = 36')
          if 'ndkVersion' not in t:
              t = re.sub(r'(compileSdk\s*=\s*36)', r'\1\n        ndkVersion = "27.0.12077973"', t, count=1)
          if 'isCoreLibraryDesugaringEnabled' not in t:
              if 'compileOptions' not in t:
                  t = t.replace('android {', 'android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }', 1)
              else:
                  t = t.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'desugar_jdk_libs' not in t:
              if 'dependencies {' in t:
                  t = t.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")', 1)
              else:
                  t += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          p.write_text(t)
          print(t)
          PY
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
