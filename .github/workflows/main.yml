name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub add android_alarm_manager_plus:^5.1.2
      - run: flutter pub get
      - run: cp lib/main.dart /tmp/main.dart.bak
      - run: cp pubspec.yaml /tmp/pubspec.yaml.bak
      - run: flutter create --platforms=android --org com.lucky.hkcalendar --project-name hk_calendar .
      - run: cp /tmp/main.dart.bak lib/main.dart
      - run: cp /tmp/pubspec.yaml.bak pubspec.yaml
      - run: flutter pub get
      - run: |
          python3 << 'PY'
          import pathlib
          for name in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              p = pathlib.Path(name)
              if not p.exists():
                  continue
              t = p.read_text()
              print('===', name)
              print(t)
              if 'isCoreLibraryDesugaringEnabled' not in t:
                  if 'compileOptions' in t:
                      t = t.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
                  else:
                      t = t.replace('android {', 'android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }', 1)
              if 'coreLibraryDesugaring' not in t:
                  t = t.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")', 1)
              p.write_text(t)
              print('--- AFTER ---')
              print(p.read_text())
          PY
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
