name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub add android_alarm_manager_plus:^5.1.2
      - run: flutter pub get
      - run: cp lib/main.dart /tmp/main.dart.bak
      - run: cp pubspec.yaml /tmp/pubspec.yaml.bak
      - run: flutter create --platforms=android --org com.lucky.hkcalendar --project-name hk_calendar .
      - run: cp /tmp/main.dart.bak lib/main.dart
      - run: cp /tmp/pubspec.yaml.bak pubspec.yaml
      - run: flutter pub get
      - run: |
          python3 << 'PY'
          import pathlib, re
          for name in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              p = pathlib.Path(name)
              if not p.exists():
                  continue
              t = p.read_text()
              # 刪走之前放錯位嗰行
              t = t.replace('isCoreLibraryDesugaringEnabled = true\n', '')
              t = t.replace('isCoreLibraryDesugaringEnabled = true', '')
              # 加返 compileOptions
              if 'isCoreLibraryDesugaringEnabled' not in t:
                  if 'compileOptions' in t:
                      t = re.sub(r'compileOptions\s*\{', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', t, count=1)
                  else:
                      t = re.sub(r'android\s*\{', 'android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }', t, count=1)
              # 強行加 dependency, 唔理 dependencies 有冇空格
              if 'desugar_jdk_libs' not in t:
                  t2 = re.sub(r'dependencies\s*\{', 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")', t, count=1)
                  if t2 == t:
                      t = t + '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
                  else:
                      t = t2
              p.write_text(t)
              print('===', name)
              print(p.read_text())
          PY
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
