name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub add android_alarm_manager_plus:^5.1.2
      - run: flutter pub get
      - run: cp lib/main.dart /tmp/main.dart.bak
- run: cp pubspec.yaml /tmp/pubspec.yaml.bak
- run: flutter create --platforms=android --org com.lucky.hkcalendar --project-name hk_calendar .
- run: cp /tmp/main.dart.bak lib/main.dart
- run: cp /tmp/pubspec.yaml.bak pubspec.yaml
- run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
