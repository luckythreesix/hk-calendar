name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub add android_alarm_manager_plus:^5.1.2
      - run: flutter pub get
      - run: cp lib/main.dart /tmp/main.dart.bak
      - run: cp pubspec.yaml /tmp/pubspec.yaml.bak
      - run: flutter create --platforms=android --org com.lucky.hkcalendar --project-name hk_calendar .
      - run: cp /tmp/main.dart.bak lib/main.dart
      - run: cp /tmp/pubspec.yaml.bak pubspec.yaml
      - run: flutter pub get
      - run: |
          python3 << 'PY'
          import pathlib
          p = pathlib.Path('android/app/build.gradle.kts')
          t = p.read_text()
          t = t.replace('isMinifyEnabled = true', 'isMinifyEnabled = true\n        isCoreLibraryDesugaringEnabled = true')
          if 'coreLibraryDesugaring' not in t:
              t = t.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")')
          p.write_text(t)
          print(p.read_text())
          PY
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
